name: Task
description: A general task or chore
title: "[Task]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Create a task for work that needs to be done.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know when this is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (Flutter)
        - Backend (Firebase Functions)
        - Infrastructure
        - Documentation
        - Testing
    validations:
      required: true
