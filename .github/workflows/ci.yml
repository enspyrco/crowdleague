name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            functions:
              - 'functions/src/**'
              - 'functions/test/**'
              - 'functions/package.json'
              - 'functions/package-lock.json'

  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload Flutter coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info

  functions:
    name: Functions Lint & Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.functions == 'true' }}
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload Functions coverage
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage/lcov.info

  # Summary job for branch protection (replaces old "Analyze & Test" job)
  ci-status:
    name: Analyze & Test
    runs-on: ubuntu-latest
    needs: [changes, flutter, functions]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.flutter.result }}" == "failure" || "${{ needs.functions.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
