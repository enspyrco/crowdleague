name: crowdleague
description: "Be in a league of your own..."
publish_to: 'none'

version: 0.0.3+9

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  go_router: ^14.6.0
  google_sign_in: ^6.2.2
  google_maps_flutter: ^2.10.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  rxdart: ^0.28.0
  geolocator: ^13.0.2
  screenshot: ^3.0.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  firebase_storage: ^12.3.6
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.6
  fc_native_image_resize: ^0.14.1
  firebase_crashlytics: ^4.2.0
  firebase_analytics: ^11.3.6
  cloud_functions: ^5.2.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  fake_cloud_firestore: ^3.1.0
  firebase_storage_mocks: ^0.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/google_icon.png
    - assets/json/dark_mode_style.json

  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/icons.ttf
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Light.ttf
          weight: 300
        - asset: assets/fonts/Raleway-Regular.ttf